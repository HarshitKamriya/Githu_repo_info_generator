<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repo Info Generator</title>
  <meta name="description" content="Generate Markdown summaries for any GitHub repository." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/css/index.css" />
</head>
<body>
  <div class="bg-gradient" aria-hidden="true">
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>
  </div>

  <main class="container" id="app">
    <header class="header">
      <div class="header__icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#a78bfa"/><stop offset="100%" style="stop-color:#6366f1"/></linearGradient></defs>
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
        </svg>
      </div>
      <h1 class="header__title">Repo Info Generator</h1>
      <p class="header__subtitle">Generate beautiful Markdown summaries for any GitHub repository</p>
    </header>

    <section class="input-card glass" id="inputSection">
      <div class="input-group">
        <label for="repoUrl" class="input-label">Repository URL</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          </span>
          <input type="text" id="repoUrl" class="input-field" placeholder="https://github.com/owner/repo" autocomplete="off" spellcheck="false" />
        </div>
      </div>

      <div class="token-section">
        <button type="button" class="token-toggle" id="tokenToggle" onclick="toggleToken()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>GitHub Token</span>
          <span class="token-badge">Optional</span>
          <svg class="token-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="token-content" id="tokenContent">
          <input type="password" id="githubToken" class="input-field input-field--token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
          <p class="token-hint">Required for private repos. Increases rate limit to 5,000 req/hr.</p>
        </div>
      </div>

      <button type="button" class="btn-generate" id="generateBtn" onclick="generateInfo()">
        <span class="btn-generate__text" id="btnText">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          Generate Info
        </span>
        <span class="btn-generate__loader" id="btnLoader" hidden>
          <span class="spinner"></span> Generating...
        </span>
      </button>
    </section>

    <div class="toast" id="errorToast" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      <span id="errorMessage"></span>
    </div>

    <section class="results" id="resultsSection" hidden>
      <div class="tab-bar">
        <button class="tab tab--active" id="tabPreview" onclick="switchTab('preview')">Preview</button>
        <button class="tab" id="tabRaw" onclick="switchTab('raw')">Raw Markdown</button>
        <div class="tab-bar__actions">
          <button class="btn-download" id="downloadBtn" onclick="downloadFile()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download info.md
          </button>
        </div>
      </div>
      <div class="panel glass" id="panelPreview"><div class="markdown-body" id="markdownPreview"></div></div>
      <div class="panel glass" id="panelRaw" hidden><pre class="raw-markdown"><code id="rawMarkdown"></code></pre></div>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
